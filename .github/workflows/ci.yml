name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Spotless check
        run: ./mvnw -B spotless:check

      - name: Tests
        run: ./mvnw -B test

      - name: PMD
        run: ./mvnw -B pmd:check

      - name: SpotBugs
        run: ./mvnw -B -DskipTests compile spotbugs:check

      - name: PIT mutation tests
        run: ./mvnw -B -Pmutation clean test org.pitest:pitest-maven:mutationCoverage
