spring:
  main:
    web-application-type: none
  application:
    name: easy-nr6-epi-desktop-app
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: ${EASYNR6_DB_URL:jdbc:sqlite:easynr6.db}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO

management:
  tracing:
    enabled: ${EASYNR6_OBS_ENABLED:false}
    sampling:
      probability: ${EASYNR6_OBS_TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${EASYNR6_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        enabled: ${EASYNR6_OBS_ENABLED:false}
        url: ${EASYNR6_OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
  metrics:
    export:
      otlp:
        enabled: ${EASYNR6_OBS_ENABLED:false}
  observations:
    annotations:
      enabled: true

easy-nr6:
  auth:
    provider: ${EASYNR6_AUTH_PROVIDER:jdbc}
  bootstrap-admin:
    enabled: ${EASYNR6_BOOTSTRAP_ADMIN_ENABLED:true}
    mode: ${EASYNR6_BOOTSTRAP_ADMIN_MODE:dev}
    password: ${EASYNR6_BOOTSTRAP_ADMIN_PASSWORD:}
