<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cobertura — Easy NR6 mock</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    .detail-row td { background: var(--enr6-surface-sunken); font-size: 12px; }
    .detail-row ul { margin: 4px 0 8px 18px; padding: 0; }
  </style>
</head>
<body>
<header class="mock-chrome">
  <span class="title">Cobertura matriz × vigente</span>
  <nav><a href="../index.html">Catálogo</a><a href="15-pendencias.html">Pendências</a><a href="02-entrega-wizard.html">Entrega</a></nav>
</header>
<main class="page">
  <header class="page-header">
    <div class="uc-tag">Operação do dia</div>
    <h1>Cobertura de EPI</h1>
    <p class="sub">Trabalhadores ativos: matriz exigida vs fornecimento vigente (periodicidade da sessão)</p>
  </header>
  <div class="toolbar panel">
    <input id="q" placeholder="Setor, função, nome, matrícula..." style="margin:0" onkeydown="if(event.key==='Enter')filtrar()">
    <select id="st" style="max-width:180px;margin:0">
      <option value="all">Todos status</option>
      <option value="descoberto">Descoberto</option>
      <option value="vencendo">Vencendo</option>
      <option value="ok">OK</option>
    </select>
    <button class="btn btn-primary" type="button" onclick="filtrar()">Filtrar</button>
    <span id="sum" style="font-size:12px;color:var(--enr6-text-muted);margin-left:8px"></span>
  </div>
  <section class="panel">
    <table class="tbl">
      <thead><tr><th></th><th>Trabalhador</th><th>Função</th><th>Exigidos</th><th>Vigentes</th><th>Gap</th><th>Ação</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <p id="empty" class="hidden" style="margin-top:12px;color:var(--enr6-text-muted)">Nenhum registro para o filtro.</p>
  </section>
</main>
<script src="../mock-idb.js"></script>
<script src="../mock-store.js"></script>
<script>
const expanded = {};

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  }

  function filtrar() {
    const rows = Enr6MockStore.getCoverageReport({
      q: document.getElementById('q').value,
      status: document.getElementById('st').value,
    });
    document.getElementById('empty').classList.toggle('hidden', rows.length > 0);
    document.getElementById('sum').textContent = rows.length + ' trabalhador(es)';
    document.getElementById('tb').innerHTML = rows.map(r => {
      const exp = expanded[r.employeeId];
      const toggle = `<button type="button" class="btn btn-sm" onclick="toggleDetail(${r.employeeId})" aria-label="Detalhe">${exp ? '−' : '+'}</button>`;
      const action = r.gapKind === 'ok' || r.gapKind === 'sem_matriz'
        ? '—'
        : `<a href="02-entrega-wizard.html">Fornecer</a>`;
      let detail = '';
      if (exp) {
        detail = `<tr class="detail-row"><td colspan="7"><strong>Itens da matriz</strong><ul>` +
          r.items.map(i => `<li>${esc(i.epiName)} — <span class="badge ${i.badge}">${esc(i.status)}</span></li>`).join('') +
          '</ul></td></tr>';
      }
      return `<tr>
        <td>${toggle}</td>
        <td>${esc(r.employeeName)}<br><span style="font-size:11px;color:var(--enr6-text-muted)">${esc(r.employeeCode)}</span></td>
        <td>${esc(r.jobRoleName)}<br><span style="font-size:11px;color:var(--enr6-text-muted)">${esc(r.departmentName)}</span></td>
        <td>${r.required}</td>
        <td>${r.vigente}</td>
        <td><span class="badge ${r.gapBadge}">${esc(r.gapLabel)}</span></td>
        <td>${action}</td>
      </tr>${detail}`;
    }).join('');
  }

  function toggleDetail(id) {
    expanded[id] = !expanded[id];
    filtrar();
  }

  Enr6MockStore.initClient().then(function () {
    filtrar();
  });

</script>
<script src="../common.js"></script>
</body>
</html>
