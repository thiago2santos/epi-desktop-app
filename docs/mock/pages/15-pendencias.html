<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pendências — Easy NR6 mock</title>
  <link rel="stylesheet" href="../common.css">
</head>
<body>
<header class="mock-chrome">
  <span class="title">Pendências operacionais</span>
  <nav><a href="../index.html">Catálogo</a><a href="14-cobertura.html">Cobertura</a></nav>
</header>
<main class="page">
  <header class="page-header">
    <div class="uc-tag">FEAT · fila do dia</div>
    <h1>Pendências</h1>
    <p class="sub">Devolução no desligamento, trocas vencidas, descobertos e fila SESMT — dados da sessão</p>
  </header>
  <div class="toolbar panel">
    <select id="tipo" style="max-width:220px;margin:0" onchange="render()">
      <option value="">Todos tipos</option>
      <option value="Devolução">Devolução</option>
      <option value="Descoberto">Descoberto (matriz)</option>
      <option value="Troca periodicidade">Troca periodicidade</option>
      <option value="Exceção matriz">Exceção matriz</option>
      <option value="Atendimento fila">Atendimento fila</option>
    </select>
    <span id="cnt" style="font-size:12px;color:var(--enr6-text-muted)"></span>
  </div>
  <section class="panel">
    <table class="tbl">
      <thead><tr><th>Tipo</th><th>Trabalhador</th><th>Detalhe</th><th>Desde</th><th>Prioridade</th><th></th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <p id="empty" class="hidden" style="margin-top:12px;color:var(--enr6-text-muted)">Nenhuma pendência — boa operação.</p>
  </section>
</main>
<script src="../mock-idb.js"></script>
<script src="../mock-store.js"></script>
<script>
function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  }

  function render() {
    const tipo = document.getElementById('tipo').value;
    let rows = Enr6MockStore.getPendencies();
    if (tipo) rows = rows.filter(r => r.type === tipo || (tipo === 'Descoberto' && r.type.indexOf('Descoberto') === 0));
    document.getElementById('empty').classList.toggle('hidden', rows.length > 0);
    document.getElementById('cnt').textContent = rows.length + ' item(ns)';
    document.getElementById('tb').innerHTML = rows.map(r => `
      <tr>
        <td>${esc(r.type)}</td>
        <td>${esc(r.employeeName)}</td>
        <td>${esc(r.detail)}</td>
        <td>${esc(r.since)}</td>
        <td><span class="badge ${r.priorityBadge}">${esc(r.priority)}</span></td>
        <td>${r.link ? `<a href="${r.link}">Abrir</a>` : '—'}</td>
      </tr>`).join('');
  }

  Enr6MockStore.initClient().then(function () {
    render();
  });

</script>
<script src="../common.js"></script>
</body>
</html>
