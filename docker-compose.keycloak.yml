services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: easynr6-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./config/keycloak/realm-easynr6.json:/opt/keycloak/data/import/realm-easynr6.json:ro
