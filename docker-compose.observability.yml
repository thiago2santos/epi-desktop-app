services:
  lgtm:
    image: grafana/otel-lgtm:0.24.0
    container_name: easynr6-lgtm
    restart: unless-stopped
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
